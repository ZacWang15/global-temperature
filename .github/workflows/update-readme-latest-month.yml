name: Update README latest month

on:
  schedule:
    - cron: "0 4 5-7 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest year-month
        id: fetch
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -z "$META_API_KEY" ]; then
            echo "Missing required secret: META_API_KEY" >&2
            exit 1
          fi

          response="$(curl -fsS https://api.global-temperature.com/monthly-meta -H "x-api-key: $META_API_KEY")"

          max_year="$(printf '%s' "$response" | jq -r '.max_year // empty')"
          max_month="$(printf '%s' "$response" | jq -r '.max_month // empty')"
          max_month="$(printf '%s' "$max_month" | sed -E 's/^([0-9])$/0\1/')"
          latest="${max_year}-${max_month}"

          if ! printf '%s' "$latest" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
            echo "Could not parse latest year-month from API response" >&2
            echo "response: $response" >&2
            exit 1
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          LATEST: ${{ steps.fetch.outputs.latest }}
        run: |
          perl -0777 -i -pe 's/(The data spans from \d{4}-\d{2} to )\d{4}-\d{2}/$1$ENV{LATEST}/' README.md

      - name: Commit and push if changed
        env:
          LATEST: ${{ steps.fetch.outputs.latest }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No README change needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest data month to ${LATEST}"
          git push
